<!DOCTYPE html>
<html>

<head>
    <title>Menu - Fire Pot</title>
    <link rel="icon" type="image/jpeg" href="cafe_logo_trans-removebg-preview.png" />
    <link rel="stylesheet" href="style.css">
    <style>
        .menu-controls {
            margin-left: 40px;
            padding-top: 10px;
        }

        .menu-controls button {
            background-color: #ff623d;
            color: white;
            border: none;
            padding: 10px 18px;
            margin-right: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .menu-controls button:hover {
            background-color: #ff784e;
        }

        .menu-category {
            margin: 30px 40px 0;
        }

        .menu-category h3 {
            color: #ff623d;
            border-bottom: 1px solid rgba(255, 255, 255, .3);
            padding-bottom: 6px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .menu-card {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
        }

        .menu-card .item-name {
            font-weight: bold;
        }

        .menu-card .item-price {
            color: #ffb199;
            float: right;
        }

        .menu-status {
            color: white;
            margin: 20px 40px;
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <h1 style="color: white; margin-left: 40px; padding-top: 250px;">Our Menu</h1>

    <div class="menu-controls">
        <button onclick="loadFullMenu()">Full Menu</button>
        <button onclick="loadJSONMenu()">JSON Source Only</button>
        <button onclick="loadXMLMenu()">XML Source Only</button>
    </div>

    <div id="menu-status" class="menu-status"></div>
    <div id="menu-output"></div>

    <script>
        fetch("navbar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            });

        function fetchJSONMenu() {
            return fetch("menu.json")
                .then(response => {
                    if (!response.ok) throw new Error("Network error: " + response.status);
                    return response.json();
                });
        }

        function fetchXMLMenu() {
            return fetch("menu.xml")
                .then(response => {
                    if (!response.ok) throw new Error("Network error: " + response.status);
                    return response.text();
                })
                .then(text => {
                    const xml = new DOMParser().parseFromString(text, "text/xml");
                    if (xml.querySelector("parsererror")) throw new Error("Invalid XML");
                    const nodes = xml.getElementsByTagName("item");
                    const items = [];
                    for (let i = 0; i < nodes.length; i++) {
                        items.push({
                            name: nodes[i].getElementsByTagName("name")[0].textContent,
                            category: nodes[i].getElementsByTagName("category")[0].textContent,
                            price: nodes[i].getElementsByTagName("price")[0].textContent
                        });
                    }
                    return items;
                });
        }

        function renderMenu(items) {
            const grouped = {};
            items.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            let html = "";
            Object.keys(grouped).sort().forEach(category => {
                html += `<div class="menu-category"><h3>${category}</h3><div class="menu-grid">`;
                grouped[category].forEach(item => {
                    html += `<div class="menu-card"><span class="item-price">Rs. ${item.price}</span><span class="item-name">${item.name}</span></div>`;
                });
                html += "</div></div>";
            });
            document.getElementById("menu-output").innerHTML = html;
        }

        function setStatus(message) {
            document.getElementById("menu-status").innerText = message;
        }

        function loadFullMenu() {
            setStatus("Loading menu...");
            Promise.all([fetchJSONMenu(), fetchXMLMenu()])
                .then(([jsonItems, xmlItems]) => {
                    setStatus("");
                    renderMenu(jsonItems.concat(xmlItems));
                })
                .catch(error => setStatus("Error loading menu: " + error.message));
        }

        function loadJSONMenu() {
            setStatus("Loading JSON menu...");
            fetchJSONMenu()
                .then(items => {
                    setStatus("");
                    renderMenu(items);
                })
                .catch(error => setStatus("Error loading menu: " + error.message));
        }

        function loadXMLMenu() {
            setStatus("Loading XML menu...");
            fetchXMLMenu()
                .then(items => {
                    setStatus("");
                    renderMenu(items);
                })
                .catch(error => setStatus("Error loading menu: " + error.message));
        }

        loadFullMenu();
    </script>
</body>

</html>
