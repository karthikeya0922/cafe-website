<!-- appHighlight is a custom attribute directive -->
<div class="card" appHighlight>
  <div class="icon">{{ item().icon }}</div>
  <h3>{{ item().name }}</h3>

  <div class="meta">
    <!-- ngClass: built-in attribute directive -->
    <span class="tag" [ngClass]="{ veg: item().veg, 'non-veg': !item().veg }">
      {{ item().veg ? 'Veg' : 'Non-veg' }}
    </span>
    <!-- ngStyle: built-in attribute directive -->
    <span [ngStyle]="{ color: ratingColor(item().rating) }">★ {{ item().rating }}</span>
  </div>

  <p>{{ item().description }}</p>

  <div class="footer">
    <strong>{{ item().price | currency: 'INR' : 'symbol' : '1.0-0' }}</strong>
    <!-- Event binding -->
    <button (click)="add.emit(item())">Add +</button>
  </div>
</div>
