<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Fire Pot</title>
    <link rel="icon" type="image/png" href="cafe_logo_trans-removebg-preview.png" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Internal CSS -->
    <style>
        .login-form {
            max-width: 340px;
            margin: 30px auto 0;
            padding: 24px 28px;
            background: rgba(0, 0, 0, .45);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 12px;
            color: white;
        }

        .login-form label {
            display: block;
            margin: 12px 0 4px;
        }

        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .login-form button {
            margin-top: 18px;
            width: 100%;
            background-color: #ff623d;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-form button:hover {
            background-color: #ff784e;
        }

        .login-form p {
            text-align: center;
            margin-bottom: 0;
        }

        .login-form a {
            color: #ffb199;
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <!-- Inline CSS -->
    <h2 style="color: white; text-align: center; margin-top: 200px;">Login</h2>

    <form class="login-form" action="index.html">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="pwd" required>

        <button type="submit">Login</button>
        <p>New here? <a href="register.html">Create an account</a></p>
    </form>
</body>
<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => { document.getElementById("navbar").innerHTML = data; });
</script>

</html>
