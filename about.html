<html>

<head>
    <title>About Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar"></div>

    <h1 style="color: white;margin-left: 40px;padding-top: 250px;">About Us</h1>
    <div id="about-text" style="color: white; margin-left: 40px; margin-right: 40px; white-space: pre-line;"></div>
</body>
<script>
fetch("navbar.html")
.then(response => response.text())
.then(data => {
    document.getElementById("navbar").innerHTML = data;});

fetch("about.txt")
    .then(response => {
        if (!response.ok) throw new Error("Network error: " + response.status);
        return response.text();
    })
    .then(data => {
        document.getElementById("about-text").innerText = data;
    })
    .catch(error => {
        document.getElementById("about-text").innerText = "Error loading content: " + error.message;
    });
</script>
</html>
